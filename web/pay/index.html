<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Ratelplus top-up</title>
<link rel="icon" href="data:,">
<style>
/* One file, one request: see web/pay/README.md for the page-weight budget. */
/* Ratel blue (#033399) for headings, buttons and links; green only for success. */
:root{--bg:#edf0f7;--fg:#1a1d24;--mut:#4a5466;--line:#cfd6e3;--head:#033399;--acc:#033399;--accfg:#fff;--ok:#1a7f3c;--okbg:#fff;--bad:#b42318;--box:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--fg:#e8ecf4;--mut:#aab3c3;--line:#364057;--head:#a9c0ff;--acc:#3b5fd6;--accfg:#fff;--ok:#5fd38a;--okbg:#132219;--bad:#ff8a80;--box:#182032}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{width:100%;max-width:30rem;margin:0 auto;padding:0 16px}
/* The header stays white in dark mode too, so the logo keeps its own colours. */
.top{background:#fff;border-bottom:4px solid #033399}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.logo{display:block;width:132px;height:auto}
.prod{color:#033399;font-weight:800;font-size:1.125rem}
main{flex:1;width:100%;max-width:30rem;margin:0 auto;padding:28px 16px 40px}
h1{color:var(--head);font-size:1.75rem;line-height:1.2;font-weight:800;margin:0 0 12px}
h2{color:var(--head);font-size:1.2rem;font-weight:800;margin:28px 0 4px}
p{margin:4px 0 16px}
a{color:var(--head)}
.mut{color:var(--mut)}
label{display:block;margin:18px 0 6px;font-weight:700}
input{width:100%;min-height:48px;padding:12px 14px;font:inherit;font-size:1.125rem;letter-spacing:.03em;color:inherit;background:var(--box);border:2px solid var(--line);border-radius:10px}
input::placeholder{color:var(--mut);opacity:1;letter-spacing:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--head);outline-offset:2px}
.chk{display:flex;align-items:center;gap:10px;font-weight:400}
.chk input{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--acc)}
button{width:100%;min-height:52px;margin-top:28px;padding:14px 16px;font:inherit;font-size:1.125rem;font-weight:700;color:var(--accfg);background:var(--acc);border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#pay{margin-top:28px;padding-top:4px;border-top:1px solid var(--line)}
#status{min-height:1.5em;margin-top:24px;padding:0;font-weight:600}
#status.ok{color:var(--ok);background:var(--okbg);border:2px solid var(--ok);border-radius:10px;padding:20px 16px;text-align:center;font-size:1.25rem;font-weight:800}
#status.bad{color:var(--bad)}
.foot{border-top:1px solid var(--line);padding:18px 0 24px;text-align:center;font-size:.9375rem}
.foot p{margin:0}
[hidden]{display:none}
</style>
</head>
<body>
<header class="top">
<div class="wrap">
<svg class="logo" viewBox="0 0 580 164" role="img" aria-label="Ratel, power to connect"><title>Ratel</title><g fill="#033399"><path transform="translate(34.2 7.7)" d="M0 0 C14 0 29 0 43 1 C44 1 44 1 49 1 C62 2 73 3 83 12 C89 22 90 30 90 41 C87 56 78 64 67 73 C69 82 71 90 74 99 C84 127 84 127 84 134 C77 134 70 134 63 135 C61 135 58 135 56 135 C54 135 53 135 51 135 C49 135 47 135 45 135 C44 135 42 134 41 134 C37 129 36 125 34 119 C32 112 30 104 28 97 C26 90 26 90 26 88 C25 88 25 88 24 88 C24 89 24 91 23 92 C23 98 22 104 20 111 C20 113 20 115 19 118 C16 132 16 132 14 134 C6 135 -1 134 -9 135 C-11 135 -13 135 -15 135 C-17 135 -19 135 -21 135 C-23 135 -25 135 -27 135 C-28 135 -30 134 -31 134 C-33 131 -33 131 -32 124 C-31 120 -30 115 -29 111 C-27 104 -26 98 -25 92 C-23 84 -22 76 -20 67 C-18 57 -16 47 -14 37 C-6 0 -6 0 0 0Z M37 20 C34 28 32 36 31 45 C31 46 31 48 30 49 C30 52 29 56 29 59 C29 60 30 60 30 60 C37 60 37 60 41 58 C48 50 50 41 50 31 C50 25 50 25 46 20 C41 20 41 20 37 20Z"/><path transform="translate(215.9 51.6)" d="M0 0 C8 8 9 16 8 26 C5 83 5 83 -2 90 C-7 91 -12 91 -17 91 C-19 91 -20 91 -22 91 C-25 91 -29 91 -33 90 C-36 87 -36 87 -38 81 C-42 82 -42 82 -47 85 C-57 91 -67 92 -79 90 C-85 87 -88 85 -92 78 C-95 69 -95 60 -92 51 C-85 41 -75 37 -64 34 C-59 34 -54 33 -48 33 C-48 33 -48 33 -44 32 C-41 32 -37 32 -34 31 C-34 29 -33 26 -33 23 C-33 22 -33 20 -33 18 C-33 14 -33 14 -37 10 C-43 10 -43 10 -48 14 C-48 15 -48 15 -50 18 C-52 22 -52 22 -56 24 C-60 25 -64 25 -67 25 C-68 25 -68 25 -74 25 C-79 24 -79 24 -82 22 C-83 15 -81 10 -78 3 C-59 -13 -21 -14 0 0Z M-49 49 C-54 55 -54 55 -54 61 C-54 62 -54 64 -54 65 C-53 66 -51 67 -50 68 C-43 67 -42 66 -38 61 C-36 56 -36 53 -36 47 C-36 47 -37 47 -37 46 C-43 46 -43 46 -49 49Z"/><path transform="translate(357.9 47.7)" d="M0 0 C2 -0 4 -0 6 -0 C17 1 29 4 37 12 C42 19 41 28 40 37 C37 47 37 47 32 51 C27 52 27 52 21 52 C19 51 17 51 15 51 C13 51 10 51 8 51 C4 51 -1 51 -5 51 C-7 51 -9 51 -11 51 C-16 51 -16 51 -19 54 C-20 67 -20 67 -17 72 C-1  -3 10 C-3 9 -2 7 -2 5 C-1 1 -1 1 0 0Z"/><path transform="translate(525 87)" d="M0 0 C10 13 20 32 20 49 C18 51 14 50 11 51 C2 50 2 50 -1 47 C-2 45 -2 44 -3 42 C-4 39 -5 37 -7 34 C-7 34 -7 34 -9 30 C-12 24 -17 18 -21 12 C-17 5 -8 -2 0 0Z"/></g><g fill="#1e9e46"><path transform="translate(493 106)" d="M0 0 C6 1 7 3 11 8 C12 11 14 13 15 16 C16 18 17 20 18 22 C21 27 21 27 20 31 C15 31 9 31 4 31 C3 31 3 31 -0 31 C-4 31 -8 31 -12 31 C-15 27 -17 22 -19 17 C-15 13 -11 9 -7 6 C-6 5 -5 3 -3 2 C-2 2 -1 1 0 0Z"/><path transform="translate(458 74)" d="M0 0 C11 2 20 11 28 19 C28 20 28 20 28 21 C24 24 21 27 17 30 C15 32 13 33 11 35 C11 35 11 35 7 38 C-4 34 -4 34 -6 29 C-6 28 -5 28 -5 27 C-4 22 -4 18 -3 13 C-2 8 -1 4 0 0Z"/></g><g fill="#8dc63f"><path transform="translate(451 115)" d="M0 0 C8 3 14 8 17 16 C17 18 17 20 17 22 C15 24 9 23 7 23 C5 23 3 23 1 23 C-3 23 -3 23 -5 21 C-3 3 -3 3 0 0Z"/></g><text x="321" y="161" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="#1e9e46" textLength="256" lengthAdjust="spacingAndGlyphs">POWER TO CONNECT</text></svg>
<span class="prod">RatelPay</span>
</div>
</header>
<main>
<h1>Top up your line</h1>
<p class="mut">Add credit with a prepaid card.</p>
<!-- TODO(PRD): the exact words on this page, and what it says after a top-up. -->
<form id="f" novalidate>
<label for="phone">Phone number of the line</label>
<input id="phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="0800 000 0000">
<h2>Prepaid card</h2>
<label for="card">Card number (20 digits)</label>
<input id="card" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false">
<label for="pin">PIN (14 digits)</label>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false">
<label class="chk"><input id="show" type="checkbox"> Show the PIN</label>
<button id="go" type="submit">Add credit</button>
<div id="pay" hidden>
<h2>Pay by card</h2>
<label for="amount">Amount in naira</label>
<input id="amount" inputmode="decimal" autocomplete="off" placeholder="1000">
<button id="paygo" type="button">Continue to payment</button>
</div>
</form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<footer class="foot">
<div class="wrap">
<!-- TODO(PRD): the help wording, and whether to give a customer care number. -->
<p class="mut">Need help? Visit a Ratel Plus shop or call customer care.</p>
</div>
</footer>
<script>
(function (g) {
  "use strict";

  // Paying by card goes through Paystack. Leave this false until the sandbox is set up (the PAYMENT_*
  // settings on bss-app) and its callback address is this page; the prepaid card works without it.
  var CARD_PAYMENTS = false;
  var API = "/v1/pay";
  var NAIRA = "₦";

  var MSG = {
    phone: "Enter the phone number of the line, for example 0800 000 0000.",
    card: "The card number has 20 digits. Check it and try again.",
    pin: "The PIN has 14 digits. Check it and try again.",
    amount: "Enter the amount in naira, for example 1000.",
    refused: "This card cannot be used. Check the numbers and try again.",
    refusedPay: "This payment cannot be started. Check the number and the amount.",
    malformed: "Check the numbers you typed and try again.",
    limited: "Too many attempts. Wait a while and try again.",
    unavailable: "Card payments are not available right now. Use a prepaid card.",
    trouble: "Something went wrong. Try again.",
    waiting: "Waiting for your payment to finish...",
    failed: "The payment did not go through. Nothing was added to your line.",
    still: "Your payment is still being checked. Come back to this page in a minute."
  };

  // ---- pure logic (no page, no network); tested in web/pay/tests ------------------------------
  function digits(s) { return String(s == null ? "" : s).replace(/[\s\-.()]/g, ""); }

  // TODO(PRD): how a typed number becomes the stored form (digits, international, no plus sign).
  // Today: 0 and ten digits, or 234 and ten digits, with spaces, dashes or a leading plus allowed.
  function toMsisdn(typed) {
    var d = digits(typed).replace(/^\+/, "");
    if (/^0\d{10}$/.test(d)) return "234" + d.slice(1);
    if (/^234\d{10}$/.test(d)) return d;
    return null;
  }
  function cardNumber(typed) { var d = digits(typed); return /^\d{20}$/.test(d) ? d : null; }
  function pin(typed) { var d = digits(typed); return /^\d{14}$/.test(d) ? d : null; }

  // Naira typed by a person to whole kobo, in integers only. Up to two decimals.
  function nairaToKobo(typed) {
    var t = String(typed == null ? "" : typed).replace(/[\s,]/g, "").split(NAIRA).join("");
    var m = /^(\d{1,9})(?:\.(\d{1,2}))?$/.exec(t);
    if (!m) return null;
    var kobo = Number(m[1]) * 100 + Number(((m[2] || "") + "00").slice(0, 2));
    return kobo >= 1 ? kobo : null;
  }
  function formatNaira(kobo) {
    var whole = Math.floor(kobo / 100), rest = kobo % 100;
    return NAIRA + String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + (rest < 10 ? "0" : "") + rest;
  }
  function newKey() {
    var a = new Uint8Array(16);
    g.crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return (b < 16 ? "0" : "") + b.toString(16); }).join("");
  }

  // One Idempotency-Key per attempt: a retry after a lost reply sends the same key, and anything the
  // person changed, or any answer we understood, starts a new one.
  function keyFor(attempt, signature) {
    if (attempt.sig !== signature) { attempt.sig = signature; attempt.key = newKey(); }
    return attempt.key;
  }
  function forget(attempt) { attempt.sig = null; attempt.key = null; }

  function redeem(fields, post, attempt) {
    var msisdn = toMsisdn(fields.phone), card = cardNumber(fields.card), secret = pin(fields.pin);
    if (!msisdn) return Promise.resolve({ ok: false, message: MSG.phone, field: "phone" });
    if (!card) return Promise.resolve({ ok: false, message: MSG.card, field: "card" });
    if (!secret) return Promise.resolve({ ok: false, message: MSG.pin, field: "pin" });
    var key = keyFor(attempt, msisdn + "|" + card + "|" + secret);
    return post(API + "/vouchers/redeem", { msisdn: msisdn, card_number: card, pin: secret }, key).then(function (r) {
      var b = r.body;
      if (r.status === 200 && b && Number.isInteger(b.amount_kobo) && Number.isInteger(b.balance_kobo)) {
        forget(attempt);
        return { ok: true, clear: true, message: formatNaira(b.amount_kobo) + " added to your line. Balance: " + formatNaira(b.balance_kobo) + "." };
      }
      if (r.status === 400) { forget(attempt); return { ok: false, message: MSG.refused }; }
      if (r.status === 422) { forget(attempt); return { ok: false, message: MSG.malformed }; }
      if (r.status === 429) { forget(attempt); return { ok: false, message: MSG.limited }; }
      return { ok: false, message: MSG.trouble }; // outcome unknown: the key is kept for the retry
    });
  }

  function startPayment(fields, post, attempt) {
    var msisdn = toMsisdn(fields.phone), kobo = nairaToKobo(fields.amount);
    if (!msisdn) return Promise.resolve({ ok: false, message: MSG.phone, field: "phone" });
    if (kobo === null) return Promise.resolve({ ok: false, message: MSG.amount, field: "amount" });
    var key = keyFor(attempt, msisdn + "|" + kobo);
    return post(API + "/payments", { msisdn: msisdn, amount_kobo: kobo }, key).then(function (r) {
      var b = r.body;
      if (r.status === 200 && b && /^[A-Za-z0-9_-]{16,}$/.test(b.payment_id || "") && /^https:\/\//.test(b.checkout_url || "")) {
        forget(attempt);
        return { ok: true, paymentId: b.payment_id, checkoutUrl: b.checkout_url };
      }
      if (r.status === 400 || r.status === 422) { forget(attempt); return { ok: false, message: MSG.refusedPay }; }
      if (r.status === 429) { forget(attempt); return { ok: false, message: MSG.limited }; }
      if (r.status === 503) { forget(attempt); return { ok: false, message: MSG.unavailable }; }
      return { ok: false, message: MSG.trouble };
    });
  }

  function checkPayment(id, get) {
    if (!/^[A-Za-z0-9_-]{16,}$/.test(id || "")) return Promise.resolve({ state: "unknown", message: MSG.trouble });
    return get(API + "/payments/" + id).then(function (r) {
      var b = r.body;
      if (r.status === 200 && b && b.status === "succeeded" && Number.isInteger(b.amount_kobo)) {
        return { state: "succeeded", message: formatNaira(b.amount_kobo) + " added to your line." };
      }
      if (r.status === 200 && b && b.status === "failed") return { state: "failed", message: MSG.failed };
      if (r.status === 200 && b && b.status === "pending") return { state: "pending", message: MSG.waiting };
      if (r.status === 404) return { state: "failed", message: MSG.failed };
      return { state: "unknown", message: MSG.trouble };
    });
  }

  g.RatelPayLogic = {
    toMsisdn: toMsisdn, cardNumber: cardNumber, pin: pin, nairaToKobo: nairaToKobo,
    formatNaira: formatNaira, redeem: redeem, startPayment: startPayment, checkPayment: checkPayment, MSG: MSG
  };

  // ---- the page ---------------------------------------------------------------------------------
  function send(method, path, body, key) {
    var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 15000) : null;
    var headers = { Accept: "application/json" };
    var opts = { method: method, cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer", headers: headers };
    if (ctl) opts.signal = ctl.signal;
    if (body) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    if (key) headers["Idempotency-Key"] = key;
    return fetch(path, opts).then(function (res) {
      clearTimeout(timer);
      return res.json().then(function (b) { return { status: res.status, body: b }; }, function () { return { status: res.status, body: null }; });
    }, function () { clearTimeout(timer); return { status: 0, body: null }; });
  }

  function init(doc) {
    var $ = function (id) { return doc.getElementById(id); };
    var out = $("status"), busy = false;
    var redeemAttempt = { sig: null, key: null }, payAttempt = { sig: null, key: null };
    var STORE = "ratelpay.payment"; // only a payment id, which holds nothing about the line or its owner

    function say(text, kind) { out.textContent = text; out.className = kind || ""; }
    function hold(on) { busy = on; $("go").disabled = on; $("paygo").disabled = on; }
    function fields() { return { phone: $("phone").value, card: $("card").value, pin: $("pin").value, amount: $("amount").value }; }
    function remember(id) { try { if (id) sessionStorage.setItem(STORE, id); else sessionStorage.removeItem(STORE); } catch (e) { /* no storage: the page still works */ } }
    function recall() { try { return sessionStorage.getItem(STORE); } catch (e) { return null; } }

    $("show").addEventListener("change", function () { $("pin").type = $("show").checked ? "text" : "password"; });

    $("f").addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (busy) return;
      hold(true); say("Checking your card...", "");
      redeem(fields(), function (p, b, k) { return send("POST", p, b, k); }, redeemAttempt).then(function (r) {
        hold(false); say(r.message, r.ok ? "ok" : "bad");
        if (r.clear) { $("card").value = ""; $("pin").value = ""; }
        if (r.field) $(r.field).focus();
      });
    });

    function watch(id, tries) {
      checkPayment(id, function (p) { return send("GET", p); }).then(function (r) {
        if (r.state === "pending" && tries > 0) { say(r.message, ""); setTimeout(function () { watch(id, tries - 1); }, 3000); return; }
        if (r.state === "pending") { say(MSG.still, ""); return; }
        if (r.state !== "unknown") remember(null);
        say(r.state === "unknown" ? MSG.trouble : r.message, r.state === "succeeded" ? "ok" : "bad");
      });
    }

    if (CARD_PAYMENTS) {
      $("pay").hidden = false;
      $("paygo").addEventListener("click", function () {
        if (busy) return;
        hold(true); say("Starting your payment...", "");
        startPayment(fields(), function (p, b, k) { return send("POST", p, b, k); }, payAttempt).then(function (r) {
          hold(false);
          if (!r.ok) { say(r.message, "bad"); if (r.field) $(r.field).focus(); return; }
          remember(r.paymentId);
          g.location.assign(r.checkoutUrl);
        });
      });
      var back = recall();
      if (back) { say(MSG.waiting, ""); watch(back, 20); }
    }
  }

  if (typeof document !== "undefined" && document.getElementById("f")) init(document);
})(typeof window !== "undefined" ? window : this);
</script>
</body>
</html>
