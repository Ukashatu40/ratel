openapi: 3.1.0
info:
  title: RatelPlus cross-system contracts
  version: 0.1.0-draft
  description: |
    The two seams where RatelBSS touches the network (Build Plan, "The two contracts to freeze on
    day one"), and the part of RatelBSS's own API that RatelPay calls (M-02). This file is the
    source of truth. If code and this file disagree, the code is wrong.

    - Contract 1: RatelLink (tag `RatelLink`), runs on core-cp.
    - Contract 2: RatelMeter (tag `RatelMeter`), API runs on bss-app. It includes the meter
      agent's ingest call (`POST /v1/usage`).
    - RatelPay (tag `RatelPay`): served by RatelBSS on bss-app for the public top-up page. Every
      path starts with `/v1/pay/`, so the reverse proxy can expose those paths and nothing else.

    Conventions from the Build Plan:
    - Plain REST, standard HTTP status codes, JSON bodies.
    - Errors: `{"error": {"code": "...", "message": "..."}}`.
    - Every call carries an API key in the `Authorization` header, one key per calling system.
      The exception is RatelPay, which is public by design (ARCHITECTURE.md): its operations
      declare `security: []`, are rate-limited (429), and return nothing personal about a line's
      owner (TOP-2).
    - Every call that changes something accepts an `Idempotency-Key` header. Repeating a call with
      the same key returns the first result.
    - Times are Unix epoch seconds in UTC, sent as integers. Usage is in bytes.
    - Until RatelLink's live changes land, every change takes effect at the line's next attach.
    - Ki, OPc and voucher PINs are write-only. No response in this file may contain them.

    Anything the Build Plan does not specify is marked `TODO(contract)` in a description or with
    the `x-todo` extension. Do not fill those in by guessing. Agree them with the owners, then
    update this file in the same commit as the code.

    Not covered here yet: RatelBSS's API for RatelDesk (M-02, needs the PRD), and the payment
    gateway's webhook (M-19, the provider is not chosen). TODO(contract): add them here.
  x-todo:
    - Operational endpoints (/healthz) are deliberately not in this contract.
servers:
  - url: http://127.0.0.1:4010
    description: Local mock (make mock). TODO(contract) - real base URLs and ports per environment.
security:
  - ApiKeyAuth: []
tags:
  - name: RatelLink
    description: Contract 1. Provisioning. Only writer to RatelCore's subscriber database.
  - name: RatelMeter
    description: Contract 2. Usage and call records for billing.
  - name: RatelPay
    description: |
      Served by RatelBSS (`app` on bss-app) for the RatelPay top-up page. Public: no API key,
      rate-limited, and nothing personal about a line's owner in any response (TOP-2).
paths:
  /v1/sims:
    post:
      tags: [RatelLink]
      operationId: link_create_sim
      summary: Store a SIM's keys in RatelLink. No service yet.
      description: |
        Stores the SIM's keys in RatelLink. Does not create service. RatelBSS never sends this:
        keys go to RatelLink and RatelBSS receives only IMSI and ICCID.
        Idempotent: sending the same keys again for an IMSI succeeds and changes nothing. An IMSI
        that already has DIFFERENT keys is refused with 409 and the stored keys are never replaced.
        `amf` is not a request field: the core's document always holds the constant "8000", which
        RatelLink writes at activation (Integration Guide, section 4). Settled 2026-10-14.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimImport"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}/activate:
    post:
      tags: [RatelLink]
      operationId: link_activate_line
      summary: Write the subscriber document and give the line service.
      description: |
        Writes the subscriber document: keys, MSISDN, the internet APN at the given speeds, and the
        ims APN when `voice` is true. Activating an active line with the same settings succeeds and
        changes nothing. Takes effect at the line's next attach.
        404 when no keys are stored for the IMSI (import the SIM first). 503 when voice is requested
        and the voice template is not configured, or when no address is free.
        A fixed IPv4 address from the 10.45.0.0/16 pool is assigned at activation (RatelLink spec).
      parameters:
        - $ref: "#/components/parameters/Imsi"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}/data:
    post:
      tags: [RatelLink]
      operationId: link_set_data_mode
      summary: Change the internet APN only. Calling is untouched.
      description: |
        `full` or `slow` change the internet APN's speed. `off` removes the internet APN.
        The ims APN is never touched, so calls keep working. Takes effect at the next attach.
        Repeating a request changes nothing. 404 when the line was never activated or is not active
        (a deactivated line included). 409 when RatelLink records the line as active but the
        network has no record for it: activate it again.
      parameters:
        - $ref: "#/components/parameters/Imsi"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}/deactivate:
    post:
      tags: [RatelLink]
      operationId: link_deactivate_line
      summary: Remove service. No internet and no calls.
      description: |
        Only this endpoint stops calls. RatelLink keeps keys in its own store, deletes the Open5GS
        subscriber document, and rewrites it on activate. Takes effect at the next attach.
        Repeating it changes nothing. A SIM that was never activated also answers 200. An IMSI
        RatelLink has never heard of answers 404. The line's fixed address is released and stays
        held for 24 hours, so a later activation gives the same line the same address.
        `reason` is free text for the audit log (1 to 200 characters). TODO(contract): whether
        RatelBSS wants fixed reason codes instead. Owner: RatelBSS lines.
      parameters:
        - $ref: "#/components/parameters/Imsi"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}:
    get:
      tags: [RatelLink]
      operationId: link_get_line
      summary: Read a line's status. Never returns keys.
      description: |
        Lets RatelBSS check its view against the network's.
        Fields follow the line_state collection in the RatelLink spec.
        Built as the Build Plan lists them: status, MSISDN, APNs (the names of the sessions), IP
        address and speeds. TODO(contract): RatelBSS lines to confirm these are the fields it
        needs, and the shape of `apns`.
      parameters:
        - $ref: "#/components/parameters/Imsi"
      responses:
        "200":
          description: Line status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineStatus"
              example:
                status: active
                msisdn: "2340000000001"
                apns: [internet, ims]
                ue_ip: "10.45.0.2"
                speed_ul_mbps: 5
                speed_dl_mbps: 10
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/assignments:
    get:
      tags: [RatelLink]
      operationId: link_list_assignments
      summary: Every current IP address with its IMSI, for RatelMeter.
      description: |
        RatelMeter's agent caches this list and refreshes it every interval.
        Built as `{"assignments": [{"ue_ip", "imsi"}]}`. An address released in the last 24 hours
        is still listed with its line, because usage seen on it still belongs to that line.
        TODO(contract): the RatelMeter agent's owner to confirm the wrapper and field names, which
        the Build Plan does not give.
      responses:
        "200":
          description: Current assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/usage:
    post:
      tags: [RatelMeter]
      operationId: meter_ingest_usage
      summary: Ingest a batch of data usage records.
      description: |
        Ingests a batch of 300-second data usage records delivered by the meter agent.
        Records are keyed on `imsi` plus `period_start`. Replay of an identical interval
        overwrites the existing record, never duplicates.
        At most 5,000 records per batch. A batch containing any invalid record is rejected as a whole.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageBatch"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
    get:
      tags: [RatelMeter]
      operationId: meter_get_usage
      summary: Data usage records (one per line per 300-second interval).
      description: |
        At most 5,000 records per response, with `next_cursor` for the rest.
        Records are keyed on imsi plus period_start. Intervals are clock-aligned in UTC.
        TODO(contract): whether `from` and `to` are inclusive, and which field they filter on.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: imsi
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Imsi"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Usage records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/calls:
    get:
      tags: [RatelMeter]
      operationId: meter_get_calls
      summary: Call records (one per call).
      description: |
        At most 5,000 records per response, with `next_cursor` for the rest.
        Keyed on call_id. A call that was never answered has `answered_at` null.
        Call records are personal data: same access rules as customer records.
        TODO(contract): `from`/`to` semantics, and the `end_reason` values. The call record's fields
        are to be agreed with the network team in Week 2.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: msisdn
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Call records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/vouchers/redeem:
    post:
      tags: [RatelPay]
      operationId: pay_redeem_voucher
      summary: Credit a voucher to a line's wallet. Public, no API key.
      description: |
        Credits the voucher's value to the wallet of the line with this number. A voucher credits
        exactly once, however many times it is redeemed (PRODUCT_RULES, Vouchers).
        Every refusal gets the same 400: a wrong PIN, a PIN that fails its Luhn check, a voucher
        that is used, expired, locked or unknown, and a number that is not a line that can be
        credited. The answer never says which it was, or whether a line or a voucher exists.
        A request of the wrong shape gets 422.
        Failed attempts are limited (at most 5 per hour, PRODUCT_RULES) and answered with 429.
        Attempts are counted whether or not the voucher exists, so 429 is not a clue either.
        Idempotency-Key is required: a retry after a lost response returns the first result,
        instead of the 400 a used voucher would get.
        No response contains the PIN or anything about the line's owner (TOP-2).
      x-todo:
        - Voucher lookup and the rate-limit key need the M-18 owner's decision. PRODUCT_RULES stores PINs hashed and counts failed attempts per card number, but this request has no card number.
        - Which line states can be credited (a suspended line, for example) is not specified.
      security: []
      parameters:
        - $ref: "#/components/parameters/BssIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: The voucher was credited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResult"
        "400":
          $ref: "#/components/responses/RedeemFailed"
        "422":
          $ref: "#/components/responses/PayValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/bundles:
    get:
      tags: [RatelPay]
      operationId: pay_list_bundles
      summary: Bundles on sale. Public, no API key.
      description: |
        Every bundle in the `on_sale` state. Retired bundles are never listed. Not paged: the list
        of bundles on sale is short. RatelPay cannot buy a bundle yet; there is no operation for it.
      security: []
      responses:
        "200":
          description: Bundles on sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayBundleList"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/payments:
    post:
      tags: [RatelPay]
      operationId: pay_start_payment
      summary: "DRAFT: start a payment through the gateway. Public, no API key."
      description: |
        DRAFT. TODO(contract): the payment provider is not chosen (PRODUCT_RULES decision 6), so
        this operation's fields will change. Do not build against it yet.
        Starts a payment of `amount_kobo` for the line with this number. Nothing is credited here:
        the wallet is credited only after the provider's webhook is verified and the transaction
        is re-queried with the provider (PRODUCT_RULES, Payments).
      x-todo:
        - What the page needs to send the customer to the provider (a checkout link or similar) depends on the provider.
        - Lowest and highest amount.
        - The error when the provider cannot be reached.
        - Idempotency-Key is required here as on redeem (a retried payment must not start twice); confirm with the M-19 owner.
      security: []
      parameters:
        - $ref: "#/components/parameters/BssIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStartRequest"
      responses:
        "200":
          description: The payment was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "422":
          $ref: "#/components/responses/PayValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/payments/{payment_id}:
    get:
      tags: [RatelPay]
      operationId: pay_get_payment
      summary: "DRAFT: a payment's status. Public, no API key."
      description: |
        DRAFT. TODO(contract): the payment provider is not chosen (PRODUCT_RULES decision 6), so
        this operation's fields will change. Do not build against it yet.
        Anyone who has the `payment_id` can call this, so the response holds nothing about the
        line or its owner, and the id must be impossible to guess.
      x-todo:
        - The status values depend on the provider.
      security: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/PaymentNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        One API key per calling system, rotated every 90 days. Keys never live in the repository.
        Sent as `Authorization: Bearer <key>`. A missing or invalid key gets 401.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        RatelLink's operations are idempotent by construction: repeating a call with the same
        body changes nothing, with or without this header. The header is accepted and must not be
        empty. It is not stored, so it has no retention window.
        TODO(contract): key format and length, and whether RatelBSS needs the first result
        returned verbatim. Owner: RatelBSS lines.
      schema:
        type: string
        minLength: 1
    BssIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        RatelBSS stores the key (in Redis, M-26) with the first result. Repeating a call with the
        same key returns that first result and changes nothing.
        TODO(contract): key format and length, and how long a key is kept. Owner: RatelBSS lines.
      schema:
        type: string
        minLength: 1
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      x-todo: Format not specified. It must be impossible to guess (the operation is public).
    Imsi:
      name: imsi
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Imsi"
    From:
      name: from
      in: query
      required: true
      description: Unix epoch seconds, UTC.
      schema:
        type: integer
        minimum: 0
    To:
      name: to
      in: query
      required: true
      description: Unix epoch seconds, UTC.
      schema:
        type: integer
        minimum: 0
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Value of `next_cursor` from the previous page.
        TODO(contract): the Build Plan names `next_cursor` in responses but not the request
        parameter. `cursor` is a placeholder.
      schema:
        type: string
        minLength: 1
  responses:
    OkEmpty:
      description: |
        Success. RatelLink returns an empty JSON object. TODO(contract): RatelBSS lines to
        confirm it needs nothing more in the body (the Build Plan does not specify one).
      content:
        application/json:
          schema:
            type: object
    Unauthorized:
      description: Missing or invalid Bearer API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: unauthorized, message: "Invalid or missing API key."}
    Conflict:
      description: |
        Nothing was changed. Either the IMSI already has different keys stored (`POST /v1/sims`),
        or the network has no record for the line (`POST /v1/lines/{imsi}/data`): activate it again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: conflict, message: "The network has no record for this line. Activate it again."}
    NotFound:
      description: Unknown line.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: not_found, message: "Unknown line."}
    ValidationError:
      description: |
        Invalid request. RatelLink answers 422 for every validation failure (a bad IMSI in the
        path included). TODO(contract): RatelBSS lines to confirm they handle 422 and not 400.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: validation_error, message: "Invalid request. Fields: body.msisdn"}
    Unavailable:
      description: |
        RatelLink cannot do this right now and nothing was changed. Try again later, and tell the
        RatelLink owner if it persists. Voice was requested with no voice template configured, no
        address was free, or the service cannot handle SIM keys.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: unavailable, message: "Voice cannot be switched on right now."}
    RedeemFailed:
      description: |
        The voucher was not credited. One answer for every reason (wrong PIN, failed Luhn check,
        voucher used, expired, locked or unknown, number not a line that can be credited), so it
        reveals nothing. The attempt counts towards the limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: redeem_failed, message: "This voucher cannot be used."}
    PayValidationError:
      description: |
        The request has the wrong shape: a missing field, or a number or PIN of the wrong length
        or with characters other than digits. The message names the fields, never their values.
        A PIN of the right shape that fails its Luhn check is not this error: it gets 400.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: validation_error, message: "Invalid request. Fields: body.pin"}
    TooManyRequests:
      description: |
        Too many requests. Try again later. Redeem answers this after too many failed attempts
        (at most 5 per hour, PRODUCT_RULES); every RatelPay operation is rate-limited.
        TODO(contract): the limits other than redemption's, and whether a Retry-After header is sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: too_many_attempts, message: "Too many attempts. Try again later."}
    PaymentNotFound:
      description: Unknown payment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: not_found, message: "Unknown payment."}
    UnexpectedError:
      description: Any other failure, in the standard error shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: internal_error, message: "Internal error"}
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
    Imsi:
      type: string
      pattern: "^[0-9]{15}$"
      description: The SIM's 15 digit identity on the network. Ours start with 62100.
      examples: ["621000000000001"]
    SimImport:
      type: object
      required: [imsi, ki, opc]
      additionalProperties: false
      properties:
        imsi:
          $ref: "#/components/schemas/Imsi"
        ki:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          writeOnly: true
          description: Secret. Write-only. Never returned, logged or sent to RatelBSS.
          x-todo: The core stores 32 hex characters (Integration Guide, section 4). Whether the SIM supplier delivers keys in that form is risk R-01.
        opc:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          writeOnly: true
          description: Secret. Write-only. Never returned, logged or sent to RatelBSS.
          x-todo: The core stores 32 hex characters (Integration Guide, section 4). Whether the SIM supplier delivers keys in that form is risk R-01.
    ActivateRequest:
      type: object
      required: [msisdn, speed_ul_mbps, speed_dl_mbps, voice]
      additionalProperties: false
      properties:
        msisdn:
          type: string
          pattern: "^234[0-9]{10}$"
          description: |
            The number as the core stores it: 234 and ten digits, no plus sign. The voice layer
            looks lines up in this form, so a number in any other form cannot be called.
            Decided 2026-10-13 (N6 in docs/RATELCORE_INTEGRATION_FACTS.md): the API takes this
            stored form, so RatelLink never converts.
        speed_ul_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        speed_dl_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        voice:
          type: boolean
          description: When true, the ims APN is written so the line can make calls.
    SpeedMbps:
      type: number
      exclusiveMinimum: 0
      maximum: 10000
      multipleOf: 0.001
      description: |
        Megabits per second. The core stores whole numbers, so the value must be a whole number of
        bits per second (1.5 is stored as 1500 Kbps). Zero is refused.
      x-todo: The maximum (10 Gbit/s) is a sanity limit chosen here. The Build Plan gives none.
    DataRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [full, slow, "off"]
        speed_ul_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        speed_dl_mbps:
          $ref: "#/components/schemas/SpeedMbps"
      if:
        properties:
          mode:
            enum: [full, slow]
      then:
        required: [speed_ul_mbps, speed_dl_mbps]
      description: "`full` and `slow` need both speeds. `off` ignores them."
      x-todo: The Build Plan lists the speeds as body fields without saying when they are required.
    DeactivateRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Free text for the audit log. At most 200 characters.
          x-todo: Allowed values not specified in the Build Plan.
    LineStatus:
      type: object
      required: [status]
      additionalProperties: false
      description: Never contains ki or opc.
      properties:
        status:
          type: string
          enum: [provisioned, active, barred]
          examples: [active]
        msisdn:
          type: [string, "null"]
          examples: ["2340000000001"]
        apns:
          type: array
          items:
            type: string
          examples: [[internet, ims]]
          x-todo: Item shape is not specified. Strings (`internet`, `ims`) are a placeholder.
        ue_ip:
          type: [string, "null"]
          description: Fixed IPv4 address from the 10.45.0.0/16 pool.
