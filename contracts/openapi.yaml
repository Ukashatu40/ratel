openapi: 3.1.0
info:
  title: RatelPlus cross-system contracts
  version: 0.1.0-draft
  description: |
    The two seams where RatelBSS touches the network (Build Plan, "The two contracts to freeze on
    day one"). This file is the source of truth. If code and this file disagree, the code is wrong.

    - Contract 1: RatelLink (tag `RatelLink`), runs on core-cp.
    - Contract 2: RatelMeter (tag `RatelMeter`), API runs on bss-app.
    - RatelBSS's own API for RatelDesk and RatelPay (tag `RatelBSS`), M-02. RatelPay's
      operations all start with `/v1/pay/`.

    Conventions from the Build Plan:
    - Plain REST, standard HTTP status codes, JSON bodies.
    - Errors: `{"error": {"code": "...", "message": "..."}}`.
    - Every call carries an API key in the `Authorization` header, one key per calling system.
      The one exception is RatelDesk's staff: a person signs in (`bss_staff_login`) and the browser
      then sends the session cookie `StaffSession` instead. Those operations say so in `security`.
      RatelPay's public paths keep this rule. The page is a static file in a browser and cannot
      keep a key secret, so it sends none: the reverse proxy adds the key on each public path and
      replaces anything the browser sent.
    - Every call that changes something accepts an `Idempotency-Key` header. Repeating a call with
      the same key returns the first result.
    - Times are Unix epoch seconds in UTC, sent as integers. Usage is in bytes.
    - Money is whole kobo, sent as integers. Never a decimal.
    - Until RatelLink's live changes land, every change takes effect at the line's next attach.
    - Ki, OPc and voucher PINs are write-only. No response in this file may contain them.

    Anything the Build Plan or the PRD (`docs/PRODUCT_RULES.md`) does not specify is marked
    `TODO(contract)` in a description or with the `x-todo` extension. Do not fill those in by
    guessing. Agree them with the owners, then update this file in the same commit as the code.

    The `RatelBSS` operations cover only the four PRD demo journeys that belong to RatelBSS
    (PRODUCT_RULES.md, Demo journeys). Self-care and dealer apps are out of scope (Build Plan,
    "What not to build yet"). The meter agent's ingest call is `meter_ingest_usage`; its
    authentication scheme and batch size are still TODO(contract).

    Not covered here yet: the payment gateway's webhook (M-19, the provider is not chosen).
    TODO(contract): add it here.
  x-todo:
    - Operational endpoints (/healthz, /readyz) are deliberately not in this contract.
    - RatelLink's internal sell-to-activate endpoint (/v1/lines/activate with body line_id) is
      not in this contract. The external version is bss_activate_line.
servers:
  - url: http://127.0.0.1:4010
    description: Local mock (make mock). TODO(contract) - real base URLs and ports per environment.
security:
  - ApiKeyAuth: []
tags:
  - name: RatelLink
    description: Contract 1. Provisioning. Only writer to RatelCore's subscriber database.
  - name: RatelMeter
    description: Contract 2. Usage and call records for billing.
  - name: RatelBSS
    description: RatelBSS's own API for RatelDesk and RatelPay (M-02). Not a network seam.
paths:
  /v1/sims:
    post:
      tags: [RatelLink]
      operationId: link_create_sim
      summary: Store a SIM's keys in RatelLink. No service yet.
      description: |
        Stores the SIM's keys in RatelLink. Does not create service. RatelBSS never sends this:
        keys go to RatelLink and RatelBSS receives only IMSI and ICCID.
        Idempotent: sending the same keys again for an IMSI succeeds and changes nothing. An IMSI
        that already has DIFFERENT keys is refused with 409 and the stored keys are never replaced.
        `amf` is not a request field: the core's document always holds the constant "8000", which
        RatelLink writes at activation (Integration Guide, section 4). Settled 2026-10-14.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimImport"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}/activate:
    post:
      tags: [RatelLink]
      operationId: link_activate_line
      summary: Write the subscriber document and give the line service.
      description: |
        Writes the subscriber document: keys, MSISDN, the internet APN at the given speeds, and the
        ims APN when `voice` is true. Activating an active line with the same settings succeeds and
        changes nothing. Takes effect at the line's next attach.
        404 when no keys are stored for the IMSI (import the SIM first). 503 when voice is requested
        and the voice template is not configured, or when no address is free.
        A fixed IPv4 address from the 10.45.0.0/16 pool is assigned at activation (RatelLink spec).
      parameters:
        - $ref: "#/components/parameters/Imsi"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}/data:
    post:
      tags: [RatelLink]
      operationId: link_set_data_mode
      summary: Change the internet APN only. Calling is untouched.
      description: |
        `full` or `slow` change the internet APN's speed. `off` removes the internet APN.
        The ims APN is never touched, so calls keep working. Takes effect at the next attach.
        Repeating a request changes nothing. 404 when the line was never activated or is not active
        (a deactivated line included). 409 when RatelLink records the line as active but the
        network has no record for it: activate it again.
      parameters:
        - $ref: "#/components/parameters/Imsi"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}/deactivate:
    post:
      tags: [RatelLink]
      operationId: link_deactivate_line
      summary: Remove service. No internet and no calls.
      description: |
        Only this endpoint stops calls. RatelLink keeps keys in its own store, deletes the Open5GS
        subscriber document, and rewrites it on activate. Takes effect at the next attach.
        Repeating it changes nothing. A SIM that was never activated also answers 200. An IMSI
        RatelLink has never heard of answers 404. The line's fixed address is released and stays
        held for 24 hours, so a later activation gives the same line the same address.
        `reason` is free text for the audit log (1 to 200 characters). TODO(contract): whether
        RatelBSS wants fixed reason codes instead. Owner: RatelBSS lines.
      parameters:
        - $ref: "#/components/parameters/Imsi"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{imsi}:
    get:
      tags: [RatelLink]
      operationId: link_get_line
      summary: Read a line's status. Never returns keys.
      description: |
        Lets RatelBSS check its view against the network's.
        Fields follow the line_state collection in the RatelLink spec.
        Built as the Build Plan lists them: status, MSISDN, APNs (the names of the sessions), IP
        address and speeds. TODO(contract): RatelBSS lines to confirm these are the fields it
        needs, and the shape of `apns`.
      parameters:
        - $ref: "#/components/parameters/Imsi"
      responses:
        "200":
          description: Line status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineStatus"
              example:
                status: active
                msisdn: "2340000000001"
                apns: [internet, ims]
                ue_ip: "10.45.0.2"
                speed_ul_mbps: 5
                speed_dl_mbps: 10
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/assignments:
    get:
      tags: [RatelLink]
      operationId: link_list_assignments
      summary: Every current IP address with its IMSI, for RatelMeter.
      description: |
        RatelMeter's agent caches this list and refreshes it every interval.
        Built as `{"assignments": [{"ue_ip", "imsi"}]}`. An address released in the last 24 hours
        is still listed with its line, because usage seen on it still belongs to that line.
        TODO(contract): the RatelMeter agent's owner to confirm the wrapper and field names, which
        the Build Plan does not give.
      responses:
        "200":
          description: Current assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/usage:
    post:
      tags: [RatelMeter]
      operationId: meter_ingest_usage
      summary: Ingest a batch of data usage records.
      description: |
        Ingests a batch of 300-second data usage records delivered by the meter agent.
        Records are keyed on `imsi` plus `period_start`. Replay of an identical interval
        overwrites the existing record, never duplicates.
        At most 5,000 records per batch. A batch containing any invalid record is rejected as a whole.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageBatch"
      responses:
        "200":
          $ref: "#/components/responses/OkEmpty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
    get:
      tags: [RatelMeter]
      operationId: meter_get_usage
      summary: Data usage records (one per line per 300-second interval).
      description: |
        At most 5,000 records per response, with `next_cursor` for the rest.
        Records are keyed on imsi plus period_start. Intervals are clock-aligned in UTC.
        TODO(contract): whether `from` and `to` are inclusive, and which field they filter on.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: imsi
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Imsi"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Usage records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/calls:
    get:
      tags: [RatelMeter]
      operationId: meter_get_calls
      summary: Call records (one per call).
      description: |
        At most 5,000 records per response, with `next_cursor` for the rest.
        Keyed on call_id. A call that was never answered has `answered_at` null.
        Call records are personal data: same access rules as customer records.
        TODO(contract): `from`/`to` semantics, and the `end_reason` values. The call record's fields
        are to be agreed with the network team in Week 2.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: msisdn
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Call records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/auth/login:
    post:
      tags: [RatelBSS]
      operationId: bss_staff_login
      security: []
      summary: Sign a staff member in to RatelDesk.
      description: |
        Takes an email and a password. On success sets the session cookie `ratel_desk`
        (`HttpOnly`, `Secure`, `SameSite=Strict`; it lasts 8 hours at most and ends after 30
        minutes without use) and answers who signed in. The cookie's value is never in a body.
        Every refusal (unknown email, wrong password, disabled or locked account) is the same
        `401`, so the answer says nothing about which. Five wrong passwords in a row lock the
        account for 15 minutes. Sign-in is open by definition; the proxy limits its rate per
        address. TODO(PRD, decision 11): lockout and session lengths are the project lead's
        choices of 2026-10-27 for the first release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie `ratel_desk`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/auth/logout:
    post:
      tags: [RatelBSS]
      operationId: bss_staff_logout
      security: []
      summary: End this staff session.
      description: |
        Ends the session on the server and clears the cookie. Always `204`, signed in or not, so
        a page can call it without checking first.
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/auth/me:
    get:
      tags: [RatelBSS]
      operationId: bss_staff_me
      security:
        - StaffSession: []
      summary: Who is signed in.
      description: RatelDesk asks this when it loads, to know whether to show the sign-in page.
      responses:
        "200":
          description: The signed-in staff member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/customers:
    post:
      tags: [RatelBSS]
      operationId: bss_create_customer
      security:
        - StaffSession: []
      summary: Register a customer. KYC verified before any line is activated.
      description: |
        Creates a customer. `kyc_status` is pending, verified or rejected; no line activates until
        it is `verified` (PRODUCT_RULES.md, Customers and KYC). Customer and KYC data never leave
        RatelBSS and never reach RatelLink or RatelMeter.
        `id_type` allowed values and `address` format are open (PRODUCT_RULES.md, decision 3).
        The demo value for `id_type` is `NIN` only; the demo value for `address` is free text.
        The customer's NIN is captured at registration but never logged, never returned in any
        response beyond this customer's own record, and never in any list.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/customers/{customer_id}:
    get:
      tags: [RatelBSS]
      operationId: bss_get_customer
      security:
        - StaffSession: []
      summary: Read one customer. KYC status and identity data are personal data.
      description: |
        Returns one customer. Used by RatelDesk, which is reachable only over the VPN.
        RatelPay never calls this (PRODUCT_RULES.md, TOP-2: RatelPay shows nothing personal).
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/plans:
    get:
      tags: [RatelBSS]
      operationId: bss_list_plans
      security:
        - StaffSession: []
      summary: Plans on sale, for the sell-a-SIM journey.
      description: |
        Returns plans in state `on_sale`. Pagination is TODO(contract): the Build Plan gives no
        page size for plans and the number of plans is small.
      responses:
        "200":
          description: On-sale plans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/stock/sims:
    get:
      tags: [RatelBSS]
      operationId: bss_list_stock_sims
      security:
        - StaffSession: []
      summary: Free SIMs, for the sell-a-SIM journey.
      description: |
        Returns SIMs in state `in_stock`. Never returns Ki or OPc: SIM stock in RatelBSS holds
        ICCID, IMSI and batch only (PRODUCT_RULES.md, SIMs).
      parameters:
        - name: limit
          in: query
          required: false
          description: TODO(contract) - page size for stock lists, and the cursor to use.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
      responses:
        "200":
          description: Free SIMs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/stock/numbers:
    get:
      tags: [RatelBSS]
      operationId: bss_list_stock_numbers
      security:
        - StaffSession: []
      summary: Free numbers, for the sell-a-SIM journey.
      description: |
        Returns numbers in state `available`. The stored form is 234 and ten digits
        (PRODUCT_RULES.md, Customers and KYC). A number and a SIM are each taken once.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
      responses:
        "200":
          description: Free numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines:
    post:
      tags: [RatelBSS]
      operationId: bss_create_line
      security:
        - StaffSession: []
      summary: Attach a customer, a SIM, a number and a plan as a line, awaiting activation.
      description: |
        Takes a free SIM and a free number atomically (PRODUCT_RULES.md: a SIM or number cannot be
        taken twice, even by simultaneous requests). The line starts in `awaiting_activation`.
        If `kyc_status` is not `verified`, activation later refuses (PRODUCT_RULES.md, Customers
        and KYC). The line is created here; the RatelLink `/activate` call happens in
        `bss_activate_line`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLineRequest"
      responses:
        "201":
          description: Line created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Line"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{line_id}:
    get:
      tags: [RatelBSS]
      operationId: bss_get_line
      security:
        - StaffSession: []
      summary: One line's state and, when suspended, the state it was suspended from.
      description: |
        Returns the line's state (`awaiting_activation`, `active`, `out_of_data`, `expired`,
        `suspended`, `terminated`) and, while suspended, `state_before_suspension`. Does not return
        usage: the line page's usage comes from the RatelMeter API (M-12), never from here.
      parameters:
        - $ref: "#/components/parameters/LineId"
      responses:
        "200":
          description: The line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Line"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{line_id}/activate:
    post:
      tags: [RatelBSS]
      operationId: bss_activate_line
      security:
        - StaffSession: []
      summary: Activate a line. First plan paid for and KYC verified.
      description: |
        Calls RatelLink's `/activate` with the plan's speeds and voice true (PRODUCT_RULES.md,
        Line lifecycle). Only the state machine calls RatelLink; each transition writes an audit
        entry with who and why (PRODUCT_RULES.md, Line lifecycle).
        If RatelLink fails, the line's state does not change; the call is retried with the same
        `Idempotency-Key` (PRODUCT_RULES.md, failure in the middle of a transition).
        A line whose `kyc_status` is not `verified`, or that is not in `awaiting_activation`,
        answers `409` (the line is in a state where it cannot be activated).
      parameters:
        - $ref: "#/components/parameters/LineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateLineRequest"
      responses:
        "200":
          description: Activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Line"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{line_id}/suspend:
    post:
      tags: [RatelBSS]
      operationId: bss_suspend_line
      security:
        - StaffSession: []
      summary: Suspend a line with a reason. Customer care action.
      description: |
        `active` or `out_of_data` -> `suspended`. Calls RatelLink's `/deactivate`. Writes an audit
        entry with the reason. Every care action carries a reason from a short fixed list plus free
        text; starting list from PRODUCT_RULES.md (decided 2026-10-23): `fraud`, `non_payment`,
        `customer_request`, `lost_sim`, `other`. The list is edited by @capitanaserdel and
        @ml-lawarn before RatelDesk is built.
        A line that is not active or out_of_data answers `409` (invalid transition).
      parameters:
        - $ref: "#/components/parameters/LineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendLineRequest"
      responses:
        "200":
          description: Suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Line"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{line_id}/reinstate:
    post:
      tags: [RatelBSS]
      operationId: bss_reinstate_line
      security:
        - StaffSession: []
      summary: Reinstate a suspended line. Customer care action.
      description: |
        `suspended` -> the state it had before (`state_before_suspension`). Calls RatelLink's
        `/activate`, then `/data` if the previous state was `out_of_data`. Writes an audit entry
        with the reason. If `state_before_suspension` is not `active` or `out_of_data`, the stored
        data is wrong and the call answers `500` with a standard error; the caller does not retry.
        A line that is not suspended answers `409`.
      parameters:
        - $ref: "#/components/parameters/LineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReinstateLineRequest"
      responses:
        "200":
          description: Reinstated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Line"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/lines/{line_id}/terminate:
    post:
      tags: [RatelBSS]
      operationId: bss_terminate_line
      security:
        - StaffSession: []
      summary: Terminate a line. Customer care action or end of contract.
      description: |
        Any state except `terminated` -> `terminated`. Calls RatelLink's `/deactivate`. The SIM is
        retired. The line's number is left in `in_use`: quarantine of the number after termination
        is compliance's call (PRODUCT_RULES.md, decision 4), and the period is undecided, so the
        number's state does not change here.
        A line that is already `terminated` answers `409` (invalid transition).
      parameters:
        - $ref: "#/components/parameters/LineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateLineRequest"
      responses:
        "200":
          description: Terminated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Line"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/vouchers/redeem:
    post:
      tags: [RatelBSS]
      operationId: bss_redeem_voucher
      summary: Redeem a prepaid card for the line with this phone number. Called for RatelPay.
      description: |
        Credits the card's face value to the wallet of the line that has `msisdn`, once.
        The caller is the reverse proxy in front of RatelPay's page, with a key of its own
        (`PAY_API_KEY`). The page is a static file in a browser and cannot keep a key secret, so it
        sends none: the proxy adds the key to this one route and replaces anything the browser sent.
        That keeps the rule that every call carries a key. It does not stop someone who calls the
        proxy directly, and is not meant to: the protection against guessing is that there are at
        most 5 failed attempts per card number per hour (PRODUCT_RULES.md, Vouchers), counted for
        numbers that do not exist as well, and a per-address rate limit at the proxy.
        What the caller learns is deliberately little. A wrong number, a wrong PIN, an unknown
        phone number, a card that was used, locked, not yet on sale or expired all answer the same
        `400`. Only two answers differ, and neither says anything about any card: `422` when the
        digits are not well formed (a typo, caught by the PIN's Luhn check digit; not counted), and
        `429` when the number has had 5 failures in the last hour (the PIN is not even looked at).
        A repeat by the same line, after the card was redeemed, answers `200` again with the same
        amounts and credits nothing more, so a retry after a lost reply is safe.
        `msisdn` is the stored form: digits only, international format without a plus sign.
        TODO(PRD): how RatelPay turns what a customer types into that form, and the screen wording.
        The answer is sent with `Cache-Control: no-store`. The card number and PIN are never
        logged, and never in an answer.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemVoucherRequest"
      responses:
        "200":
          description: Redeemed (or already redeemed by this line).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemVoucherResponse"
        "400":
          $ref: "#/components/responses/VoucherRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/bundles:
    get:
      tags: [RatelBSS]
      operationId: bss_list_bundles
      summary: Bundles on sale, for RatelPay.
      description: |
        Every bundle in the `on_sale` state. Retired bundles are never listed. Not paged: the list
        of bundles on sale is short. RatelPay cannot buy a bundle yet: buying needs the purchase
        flow, which is not built, so there is no operation for it.
        Called for RatelPay through the reverse proxy, which adds the key (see info.description).
      x-todo:
        - Exposing this path publicly at the proxy, and its rate limit, come with the RatelPay page (M-19).
      responses:
        "200":
          description: Bundles on sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/payments:
    post:
      tags: [RatelBSS]
      operationId: bss_start_payment
      summary: Start a payment through the gateway (Paystack), for RatelPay.
      description: |
        Starts a payment of `amount_kobo` for the line with this number and answers where the
        customer pays (`checkout_url`, the gateway's own page). Nothing is credited here: the wallet
        is credited only after the gateway's notification is verified and the transaction has been
        re-queried with the gateway (PRODUCT_RULES, Payments), and then exactly once.
        `Idempotency-Key` is required: the page sends the same key when it retries (a lost reply on
        3G), and gets the same payment back instead of a second one. A new attempt after a failed one
        needs a new key.
        Every refusal for the number (unknown, terminated) and the amount (outside the allowed range)
        is the same `400`, so the answer says nothing about the line. `503` when payments are not
        configured or the gateway cannot be reached; the payment is then marked failed and nothing
        is charged.
        The gateway needs an email for every payment. RatelPay shows nothing personal (TOP-2), so a
        fixed address of ours is sent, never the customer's.
        Called for RatelPay through the reverse proxy, which adds the key (see info.description).
      x-todo:
        - TODO(PRD) the lowest and highest amount. They are settings of the deployment (PAYMENT_MIN_KOBO, PAYMENT_MAX_KOBO).
        - Exposing this path publicly at the proxy, and its rate limit, are in deploy/bss-app/nginx.
      parameters:
        - $ref: "#/components/parameters/PaymentIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStartRequest"
      responses:
        "200":
          description: "The payment was started, or the first payment if this key was used before."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/PaymentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/PaymentsUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/payments/{payment_id}:
    get:
      tags: [RatelBSS]
      operationId: bss_get_payment
      summary: A payment's status, for RatelPay.
      description: |
        `pending`, `succeeded` (verified with the gateway and credited, once) or `failed`. Anyone
        who has the `payment_id` can call this, so the response holds nothing about the line or its
        owner (TOP-2), and the id cannot be guessed (24 random bytes).
        A payment that is still pending after 15 seconds is checked with the gateway on this call,
        so the page does not depend on the gateway's notification arriving.
        Called for RatelPay through the reverse proxy, which adds the key (see info.description).
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /v1/pay/webhooks/paystack:
    post:
      tags: [RatelBSS]
      operationId: bss_paystack_webhook
      summary: Paystack's notification that a charge went through.
      description: |
        Called by Paystack, not by RatelPay. The body is Paystack's, as sent. Its `x-paystack-signature`
        (HMAC-SHA512 of the raw body, keyed with the secret key) is checked first, in constant time,
        and an unsigned or wrongly signed request is refused with `401` before anything in it is read.
        A notification is never believed on its own: for a `charge.success` the transaction is
        re-queried with Paystack, and only a success for the same amount in naira is credited.
        Delivered twice, or at the same moment twice, it credits once. Other events are
        acknowledged and ignored. `503` makes Paystack deliver it again later.
        Like every call here it carries the proxy's key (the proxy adds it); Paystack does not send an
        `Idempotency-Key`, and the transaction reference is what makes a repeat harmless.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: x-paystack-signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: The signature of the raw body. Never logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                additionalProperties: false
                properties:
                  received:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/PaymentsUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        One API key per calling system, rotated every 90 days. Keys never live in the repository.
        Sent as `Authorization: Bearer <key>`. A missing or invalid key gets 401.
    StaffSession:
      type: apiKey
      in: cookie
      name: ratel_desk
      description: |
        A RatelDesk staff member's session, set by `bss_staff_login`. The cookie is `HttpOnly`,
        `Secure` and `SameSite=Strict`. Every request that changes something must also carry the
        header `X-Ratel-Desk` (any value): a page on another site cannot add it, which stops a
        forged request even from a browser that ignores `SameSite`. A missing or stale session
        gets 401; a role that may not do the action gets 403. The audit entry of a line change
        names the signed-in staff member (`staff:<id>`), never a name sent in the request.
        Roles: `agent` and `admin` (TODO(PRD, decision 11)).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        RatelLink's operations are idempotent by construction: repeating a call with the same
        body changes nothing, with or without this header. The header is accepted and must not be
        empty. It is not stored, so it has no retention window.
        RatelBSS's own operations (tag RatelBSS) accept it too: repeating a call with the same
        header and body returns the first result and changes nothing.
        TODO(contract): key format and length. Owner: RatelBSS lines.
      schema:
        type: string
        minLength: 1
    PaymentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required here: a retried start (a lost reply) must not start a second payment. Any string of
        1 to 120 characters; the page makes a new one for each new attempt.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      x-todo: Format not specified. It must be impossible to guess.
    Imsi:
      name: imsi
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Imsi"
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LineId:
      name: line_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    From:
      name: from
      in: query
      required: true
      description: Unix epoch seconds, UTC.
      schema:
        type: integer
        minimum: 0
    To:
      name: to
      in: query
      required: true
      description: Unix epoch seconds, UTC.
      schema:
        type: integer
        minimum: 0
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Value of `next_cursor` from the previous page.
        TODO(contract): the Build Plan names `next_cursor` in responses but not the request
        parameter. `cursor` is a placeholder.
      schema:
        type: string
        minLength: 1
  responses:
    OkEmpty:
      description: |
        Success. RatelLink returns an empty JSON object. TODO(contract): RatelBSS lines to
        confirm it needs nothing more in the body (the Build Plan does not specify one).
      content:
        application/json:
          schema:
            type: object
    Forbidden:
      description: |
        The caller is signed in but their role may not do this, or a changing request lacks the
        `X-Ratel-Desk` header (staff operations only).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: forbidden, message: "Your role may not do this."}
    Unauthorized:
      description: |
        Missing or invalid credential: a Bearer API key, or for staff operations the session
        cookie.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: unauthorized, message: "Invalid or missing API key."}
    Conflict:
      description: |
        Nothing was changed. Either the IMSI already has different keys stored (`POST /v1/sims`),
        the network has no record for the line (`POST /v1/lines/{imsi}/data`): activate it again,
        or the line is in a state where the requested transition is not allowed (RatelBSS).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: conflict, message: "The network has no record for this line. Activate it again."}
    NotFound:
      description: Unknown line, customer, SIM, number, plan or payment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: not_found, message: "Unknown resource."}
    ValidationError:
      description: |
        Invalid request. RatelLink answers 422 for every validation failure (a bad IMSI in the
        path included). TODO(contract): RatelBSS lines to confirm they handle 422 and not 400.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: validation_error, message: "Invalid request. Fields: body.msisdn"}
    Unavailable:
      description: |
        RatelLink cannot do this right now and nothing was changed. Try again later, and tell the
        RatelLink owner if it persists. Voice was requested with no voice template configured, no
        address was free, or the service cannot handle SIM keys.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: unavailable, message: "Voice cannot be switched on right now."}
    PaymentRefused:
      description: |
        The payment cannot be started: the number cannot be topped up, or the amount is outside the
        allowed range. One answer for every reason, so it says nothing about the line.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: payment_refused, message: "This payment cannot be started."}
    PaymentsUnavailable:
      description: |
        Payments are not configured on this deployment, or the gateway cannot be reached right now.
        Nothing was charged. Try again later.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: unavailable, message: "Payments are not available right now."}
    VoucherRefused:
      description: |
        The card cannot be used. One answer for every reason (a wrong number or PIN, an unknown
        phone number, a card already used, locked, not on sale or expired), so that it gives a
        guesser nothing to work from. The attempt counts towards 5 per card number per hour.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: voucher_refused, message: "This card cannot be used."}
    RateLimited:
      description: |
        This card number has had 5 failed attempts in the last hour. Nothing was checked.
        Try again after the time in `Retry-After`.
      headers:
        Retry-After:
          schema: {type: string, enum: ["3600"]}
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: rate_limited, message: "Too many attempts. Try again later."}
    UnexpectedError:
      description: Any other failure, in the standard error shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: internal_error, message: "Internal error"}
  schemas:
    StaffLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    StaffMe:
      type: object
      required: [staff_id, email, name, role]
      additionalProperties: false
      properties:
        staff_id:
          type: integer
          minimum: 1
        email:
          type: string
          maxLength: 120
        name:
          type: string
          maxLength: 120
        role:
          type: string
          enum: [agent, admin]
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
    Imsi:
      type: string
      pattern: "^[0-9]{15}$"
      description: The SIM's 15 digit identity on the network. Ours start with 62100.
      examples: ["621000000000001"]
    SimImport:
      type: object
      required: [imsi, ki, opc]
      additionalProperties: false
      properties:
        imsi:
          $ref: "#/components/schemas/Imsi"
        ki:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          writeOnly: true
          description: Secret. Write-only. Never returned, logged or sent to RatelBSS.
          x-todo: The core stores 32 hex characters (Integration Guide, section 4). Whether the SIM supplier delivers keys in that form is risk R-01.
        opc:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          writeOnly: true
          description: Secret. Write-only. Never returned, logged or sent to RatelBSS.
          x-todo: The core stores 32 hex characters (Integration Guide, section 4). Whether the SIM supplier delivers keys in that form is risk R-01.
    ActivateRequest:
      type: object
      required: [msisdn, speed_ul_mbps, speed_dl_mbps, voice]
      additionalProperties: false
      properties:
        msisdn:
          type: string
          pattern: "^234[0-9]{10}$"
          description: |
            The number as the core stores it: 234 and ten digits, no plus sign. The voice layer
            looks lines up in this form, so a number in any other form cannot be called.
            Decided 2026-10-13 (N6 in docs/RATELCORE_INTEGRATION_FACTS.md): the API takes this
            stored form, so RatelLink never converts.
        speed_ul_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        speed_dl_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        voice:
          type: boolean
          description: When true, the ims APN is written so the line can make calls.
    SpeedMbps:
      type: number
      exclusiveMinimum: 0
      maximum: 10000
      multipleOf: 0.001
      description: |
        Megabits per second. The core stores whole numbers, so the value must be a whole number of
        bits per second (1.5 is stored as 1500 Kbps). Zero is refused.
      x-todo: The maximum (10 Gbit/s) is a sanity limit chosen here. The Build Plan gives none.
    DataRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [full, slow, "off"]
        speed_ul_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        speed_dl_mbps:
          $ref: "#/components/schemas/SpeedMbps"
      anyOf:
        - properties:
            mode:
              const: "off"
        - properties:
            mode:
              enum: [full, slow]
          required: [speed_ul_mbps, speed_dl_mbps]
      description: |
        `full` and `slow` need both speeds. `off` ignores them.
    DeactivateRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Free text for the audit log. At most 200 characters.
          x-todo: Allowed values not specified in the Build Plan.
    LineStatus:
      type: object
      required: [status]
      additionalProperties: false
      description: Never contains ki or opc.
      properties:
        status:
          type: string
          enum: [provisioned, active, barred]
          examples: [active]
        msisdn:
          type: [string, "null"]
          examples: ["2340000000001"]
        apns:
          type: array
          items:
            type: string
          examples: [[internet, ims]]
          x-todo: Item shape is not specified. Strings (`internet`, `ims`) are a placeholder.
        ue_ip:
          type: [string, "null"]
          description: Fixed IPv4 address from the 10.45.0.0/16 pool.
          examples: ["10.45.0.2"]
        speed_ul_mbps:
          type: [number, "null"]
          examples: [5]
        speed_dl_mbps:
          type: [number, "null"]
          examples: [10]
    Assignment:
      type: object
      required: [ue_ip, imsi]
      additionalProperties: false
      properties:
        ue_ip:
          type: string
          examples: ["10.45.0.2"]
        imsi:
          $ref: "#/components/schemas/Imsi"
    AssignmentList:
      type: object
      required: [assignments]
      additionalProperties: false
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
    UsageRecord:
      type: object
      required: [imsi, period_start, period_end, bytes_up, bytes_down]
      additionalProperties: false
      properties:
        imsi:
          $ref: "#/components/schemas/Imsi"
        period_start:
          type: integer
          minimum: 0
          description: Unix epoch seconds, UTC. Aligned to the 300-second clock.
        period_end:
          type: integer
          minimum: 0
        bytes_up:
          type: integer
          minimum: 0
        bytes_down:
          type: integer
          minimum: 0
      examples:
        - imsi: "621000000000001"
          period_start: 1791820800
          period_end: 1791821100
          bytes_up: 1048576
          bytes_down: 5242880
    UsageBatch:
      type: object
      required: [records]
      additionalProperties: false
      description: |
        A batch of 300-second usage records from the meter agent.
        Each record is keyed on imsi + period_start; sending the same interval again overwrites.
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/UsageRecord"
      examples:
        - records:
            - imsi: "621000000000001"
              period_start: 1791820800
              period_end: 1791821100
              bytes_up: 1048576
              bytes_down: 5242880
    UsageList:
      type: object
      required: [records, next_cursor]
      additionalProperties: false
      properties:
        records:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/UsageRecord"
        next_cursor:
          type: [string, "null"]
    CallRecord:
      type: object
      required: [call_id, from_msisdn, to_msisdn, started_at, answered_at, ended_at, end_reason]
      additionalProperties: false
      properties:
        call_id:
          type: string
          minLength: 1
        from_msisdn:
          type: string
        to_msisdn:
          type: string
        started_at:
          type: integer
          minimum: 0
        answered_at:
          type: [integer, "null"]
          minimum: 0
          description: Null when the call was never answered.
        ended_at:
          type: integer
          minimum: 0
        end_reason:
          type: string
          x-todo: Values to be agreed with the network team (Week 2).
    CallList:
      type: object
      required: [records, next_cursor]
      additionalProperties: false
      properties:
        records:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/CallRecord"
        next_cursor:
          type: [string, "null"]
    Customer:
      type: object
      required: [customer_id, name, phone, email, id_type, id_number, address, kyc_status, blocked]
      additionalProperties: false
      description: |
        Personal data. Never logged, never in fixtures, never sent to RatelLink or RatelMeter
        (PRODUCT_RULES.md, Customers and KYC). No `ki` or `opc`: RatelBSS never holds them.
      properties:
        customer_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 120
        id_type:
          type: string
          minLength: 1
          maxLength: 20
          x-todo: Allowed values open (PRODUCT_RULES.md, decision 3). Demo value is NIN only.
        id_number:
          type: string
          minLength: 1
          maxLength: 20
          description: The customer's NIN. Personal data.
        address:
          type: string
          minLength: 1
          maxLength: 500
          x-todo: Format open (PRODUCT_RULES.md, decision 3). Demo value is free text.
        kyc_status:
          type: string
          enum: [pending, verified, rejected]
        blocked:
          type: boolean
    CreateCustomerRequest:
      type: object
      required: [name, phone, email, id_type, id_number, address, kyc_status]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 120
        id_type:
          type: string
          minLength: 1
          maxLength: 20
        id_number:
          type: string
          minLength: 1
          maxLength: 20
        address:
          type: string
          minLength: 1
          maxLength: 500
        kyc_status:
          type: string
          enum: [pending, verified, rejected]
    Plan:
      type: object
      required: [plan_id, name, price_kobo, validity_days, data_bytes, speed_ul_mbps, speed_dl_mbps, slow_ul_mbps, slow_dl_mbps, channels, on_exhaustion, state]
      additionalProperties: false
      properties:
        plan_id:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 80
        price_kobo:
          type: integer
          minimum: 0
          description: Whole kobo, never a decimal.
        validity_days:
          type: integer
          minimum: 1
        data_bytes:
          type: integer
          minimum: 0
        speed_ul_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        speed_dl_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        slow_ul_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        slow_dl_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        channels:
          type: string
          maxLength: 40
          x-todo: Representation is TODO(PRD). Current storage is VARCHAR(40). Do not invent a type.
        on_exhaustion:
          type: string
          enum: [slow, stop]
        state:
          type: string
          enum: [on_sale, retired]
    PlanList:
      type: object
      required: [plans]
      additionalProperties: false
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
    Sim:
      type: object
      required: [iccid, imsi, batch, state]
      additionalProperties: false
      description: SIM stock. Never contains Ki or OPc (PRODUCT_RULES.md, SIMs).
      properties:
        iccid:
          type: string
          maxLength: 20
        imsi:
          $ref: "#/components/schemas/Imsi"
        batch:
          type: string
          maxLength: 40
        state:
          type: string
          enum: [in_stock, in_use, retired]
    SimList:
      type: object
      required: [sims]
      additionalProperties: false
      properties:
        sims:
          type: array
          items:
            $ref: "#/components/schemas/Sim"
    PhoneNumber:
      type: object
      required: [msisdn, state]
      additionalProperties: false
      properties:
        msisdn:
          type: string
          pattern: "^234[0-9]{10}$"
        state:
          type: string
          enum: [available, in_use, quarantined]
    NumberList:
      type: object
      required: [numbers]
      additionalProperties: false
      properties:
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/PhoneNumber"
    CreateLineRequest:
      type: object
      required: [customer_id, iccid, msisdn, plan_id]
      additionalProperties: false
      properties:
        customer_id:
          type: integer
          minimum: 1
        iccid:
          type: string
          maxLength: 20
        msisdn:
          type: string
          pattern: "^234[0-9]{10}$"
        plan_id:
          type: integer
          minimum: 1
    ActivateLineRequest:
      type: object
      additionalProperties: false
      properties:
        speed_ul_mbps:
          $ref: "#/components/schemas/SpeedMbps"
        speed_dl_mbps:
          $ref: "#/components/schemas/SpeedMbps"
      description: |
        The speeds are optional when the line's plan is used (the plan's speeds are applied). Pass
        them to override the plan's speeds for this activation.
        TODO(contract): confirm whether overriding is wanted; the plan carries both speeds.
    SuspendLineRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [fraud, non_payment, customer_request, lost_sim, other]
        reason_text:
          type: string
          maxLength: 200
          description: Free text recorded in the audit entry.
    ReinstateLineRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [fraud, non_payment, customer_request, lost_sim, other]
        reason_text:
          type: string
          maxLength: 200
    TerminateLineRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [fraud, non_payment, customer_request, lost_sim, other]
        reason_text:
          type: string
          maxLength: 200
    RedeemVoucherRequest:
      type: object
      required: [msisdn, card_number, pin]
      additionalProperties: false
      properties:
        msisdn:
          type: string
          pattern: "^[0-9]{10,15}$"
          description: The phone number of the line to credit, as stored (digits, international form).
        card_number:
          type: string
          pattern: "^[0-9]{20}$"
          description: The 20 digit number printed on the card. Never logged.
        pin:
          type: string
          pattern: "^[0-9]{14}$"
          writeOnly: true
          description: |
            The 13 digit PIN and its Luhn check digit, as printed. Write-only: it appears in no
            response and in no log. TODO(PRD): confirm the check digit belongs to the PIN.
    RedeemVoucherResponse:
      type: object
      required: [amount_kobo, balance_kobo]
      additionalProperties: false
      properties:
        amount_kobo:
          type: integer
          minimum: 1
          description: The card's face value, in whole kobo.
        balance_kobo:
          type: integer
          description: The line's wallet balance after this redemption, in whole kobo.
    Bundle:
      type: object
      required: [bundle_id, name, price_kobo, data_bytes, validity_days]
      additionalProperties: false
      properties:
        bundle_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        price_kobo:
          type: integer
          minimum: 0
          description: Whole kobo, never a decimal.
        data_bytes:
          type: integer
          minimum: 1
        validity_days:
          type: integer
          minimum: 1
    BundleList:
      type: object
      required: [bundles]
      additionalProperties: false
      description: |
        The example bundles are made up for the mock (make mock). They are not product values:
        the real bundles, names and prices are TODO(PRD).
      properties:
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/Bundle"
      # Examples only, for the mock. Not product values.
      examples:
        - bundles:
            - bundle_id: 1
              name: "Weekly 2GB"
              price_kobo: 100000
              data_bytes: 2147483648
              validity_days: 7
            - bundle_id: 2
              name: "Daily 500MB"
              price_kobo: 20000
              data_bytes: 524288000
              validity_days: 1
            - bundle_id: 3
              name: "Monthly 10GB"
              price_kobo: 350000
              data_bytes: 10737418240
              validity_days: 30
    PaymentStartRequest:
      type: object
      required: [msisdn, amount_kobo]
      additionalProperties: false
      properties:
        msisdn:
          type: string
          pattern: "^234[0-9]{10}$"
          description: The phone number of the line to top up, as stored.
        amount_kobo:
          type: integer
          minimum: 1
          description: Whole kobo, never a decimal.
    PaymentStatus:
      type: object
      required: [payment_id, status, amount_kobo]
      additionalProperties: false
      description: |
        Holds nothing about the line or its owner, because anyone with the payment_id can read it.
      properties:
        payment_id:
          type: string
          minLength: 16
          description: Cannot be guessed.
        status:
          type: string
          enum: [pending, succeeded, failed]
        amount_kobo:
          type: integer
          minimum: 1
          description: Whole kobo, never a decimal.
    Payment:
      allOf:
        - $ref: "#/components/schemas/PaymentStatus"
        - type: object
          properties:
            checkout_url:
              type: string
              format: uri
              description: |
                Where to send the customer to pay (the gateway's own page, one use). Present when a
                payment is started, not when its status is read.
    Line:
      type: object
      required: [line_id, customer_id, iccid, imsi, msisdn, plan_id, state]
      additionalProperties: false
      description: |
        A line. `state_before_suspension` is set only while `suspended`, and records the state the
        line was in when it was suspended (PRODUCT_RULES.md, Line lifecycle).
      properties:
        line_id:
          type: integer
          minimum: 1
        customer_id:
          type: integer
          minimum: 1
        iccid:
          type: string
          maxLength: 20
        imsi:
          $ref: "#/components/schemas/Imsi"
        msisdn:
          type: string
          pattern: "^234[0-9]{10}$"
        plan_id:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [awaiting_activation, active, out_of_data, expired, suspended, terminated]
        state_before_suspension:
          type: [string, "null"]
          enum: [active, out_of_data, null]
        expires_at:
          type: [integer, "null"]
          minimum: 0
          description: Unix epoch seconds, UTC.