        speed_ul_mbps:
          type: [number, "null"]
          examples: [5]
        speed_dl_mbps:
          type: [number, "null"]
          examples: [10]
    Assignment:
      type: object
      required: [ue_ip, imsi]
      additionalProperties: false
      properties:
        ue_ip:
          type: string
