    UsageRecord:
      type: object
      required: [imsi, period_start, period_end, bytes_up, bytes_down]
      additionalProperties: false
      properties:
        imsi:
          $ref: "#/components/schemas/Imsi"
        period_start:
          type: integer
          minimum: 0
          description: Unix epoch seconds, UTC. Aligned to the 300-second clock.
        period_end:
          type: integer
          minimum: 0
        bytes_up:
          type: integer
          minimum: 0
        bytes_down:
          type: integer
          minimum: 0
