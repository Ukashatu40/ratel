# RATEL PREPAID (ADR 0013, 2026-11-27): calls are limited to what the caller's airtime buys.
#
# Installed by network/voice/prepaid/apply-prepaid.py as ~/docker_open5gs/pcscf/route/ratel_prepaid.cfg
# and included from kamailio_pcscf.cfg. The questions go to the ussd container (network/voice/ussd),
# which relays them to bss-app and answers in plain text, so this needs no JSON and no TLS:
#   GET /call/authorize?call_id=&caller=&dialled=   200 "<max seconds>" (0: no limit) | 402 "<reason>"
#   GET /call/end?call_id=&seconds=                  200 "ok"
# bss-app not answering: the ussd container answers 200 "120". The ussd container not answering
# either: the call goes ahead limited to RATEL_PREPAID_FALLBACK seconds. Emergency numbers are never
# asked about.
#
# The limit is the ims_dialog timeout ($avp(DLG_TIMEOUT_AVP)): when it runs out on an answered call,
# ims_dialog sends a BYE to both sides. ims_dialog restarts that timer at every in-dialog request
# (session refresh UPDATE, re-INVITE, ACK) with the timeout of that request, so
# RATEL_PREPAID_INDIALOG gives it what is left of the call each time, before loose_route().
#
# htable prepaid (kamailio_pcscf.cfg): m:<Call-ID> the limit in seconds, a:<Call-ID> when the call
# was answered (epoch seconds). Removed when the call ends; they expire on their own otherwise.

#!define RATEL_PREPAID_URL "http://172.22.0.40:8647"
#!define RATEL_PREPAID_FALLBACK 120

# The caller's INVITE (from route[MO]): ask, then refuse or set the limit.
route[RATEL_PREPAID_AUTHORIZE] {
	# Only calls to a number. USSD codes (*123#) and other URIs are never limited here.
	if ($rU == $null || !($rU =~ "^[+]?[0-9]+$")) {
		return;
	}
	# Emergency numbers: never asked about and never limited, whatever happens to bss-app.
	if ($rU =~ "^[+]?(112|199)$") {
		return;
	}
	$var(base) = RATEL_PREPAID_URL;
	$var(caller) = $fu;
	if ($(pcscf_asserted_identity{s.len}) > 0) {
		$var(caller) = $pcscf_asserted_identity;
	}
	$var(cid) = $(ci{s.urlencode.param});
	$var(who) = $(var(caller){s.urlencode.param});
	$var(to) = $(rU{s.urlencode.param});
	$var(answer) = "";
	http_client_query("$var(base)/call/authorize?call_id=$var(cid)&caller=$var(who)&dialled=$var(to)", "$var(answer)");
	$var(code) = $retcode;
	if ($var(code) == 402) {
		xnotice("prepaid: call $ci refused ($var(answer))\n");
		send_reply("402", "Payment Required");
		exit;
	}
	if ($var(code) == 200 && $var(answer) =~ "^[0-9]+$") {
		$var(max) = $(var(answer){s.int});
	} else {
		$var(max) = RATEL_PREPAID_FALLBACK;
		xlog("L_WARN", "prepaid: no answer about call $ci (code $var(code)), limited to $var(max) s\n");
	}
	if ($var(max) > 0) {
		$avp(DLG_TIMEOUT_AVP) = $var(max);
		$sht(prepaid=>m:$ci) = $var(max);
	}
	xnotice("prepaid: call $ci limit $var(max) s (0: none)\n");
}

# Replies to the caller's INVITE (from onreply_route[MO_reply]).
route[RATEL_PREPAID_REPLY] {
	if (!is_method("INVITE") || $sht(prepaid=>m:$ci) == $null) {
		return;
	}
	if ($rs =~ "^2") {
		if ($sht(prepaid=>a:$ci) == $null) {
			$sht(prepaid=>a:$ci) = $TS;
		}
	} else if ($rs =~ "^[3-6]") {
		# Not answered (busy, cancelled, unreachable): free the money held for it at once.
		$var(seconds) = 0;
		route(RATEL_PREPAID_END);
	}
}

# Every in-dialog request, before loose_route() (from route[WITHINDLG]).
route[RATEL_PREPAID_INDIALOG] {
	if ($sht(prepaid=>m:$ci) == $null) {
		return;
	}
	if ($sht(prepaid=>a:$ci) != $null) {
		$var(left) = $sht(prepaid=>a:$ci) + $sht(prepaid=>m:$ci) - $TS;
		if ($var(left) < 1) {
			$var(left) = 1;
		}
		$avp(DLG_TIMEOUT_AVP) = $var(left);
	}
	if (is_method("BYE")) {
		$var(seconds) = 0;
		if ($sht(prepaid=>a:$ci) != $null) {
			$var(seconds) = $TS - $sht(prepaid=>a:$ci) + 1;
		}
		route(RATEL_PREPAID_END);
	}
}

# Tell bss-app the call is over, so the money held beyond its cost is free again at once. The call
# is still charged from its call record, which also settles the hold if this report is lost.
route[RATEL_PREPAID_END] {
	$var(base) = RATEL_PREPAID_URL;
	$var(cid) = $(ci{s.urlencode.param});
	$var(ended) = "";
	http_client_query("$var(base)/call/end?call_id=$var(cid)&seconds=$var(seconds)", "$var(ended)");
	if ($retcode != 200) {
		xlog("L_WARN", "prepaid: the end of call $ci was not reported (code $retcode)\n");
	}
	$sht(prepaid=>m:$ci) = $null;
	$sht(prepaid=>a:$ci) = $null;
}
