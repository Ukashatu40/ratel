	# RATEL 2026-11-24: USSD over IMS (3GPP TS 24.390). A dial string that starts with * or #
	# (*123#) goes to the USSD service, network/voice/ussd in the ratel repository. Calls never
	# match. To switch USSD off, remove this block and restart the scscf container.
	if (is_method("INVITE") && $rU =~ "^[*#]") {
		xnotice("SCSCF: USSD $rU from $fU to the USSD service\n");
		$du = "sip:172.22.0.40:5060;transport=udp";
		t_on_reply("orig_reply");
		t_relay();
		exit;
	}
