[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
# Make `app` and `common` importable without setting PYTHONPATH (this is the services/ directory).
prepend_sys_path = %(here)s/..
# The database URL is read from the DATABASE_URL environment variable in env.py.
# Never put a URL or password in this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
