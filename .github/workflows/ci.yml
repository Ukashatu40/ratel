name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  pr-hygiene:
    name: PR title and branch name
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR title
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          branch_re='^(feature|fix|refactor|chore|docs|security)/[a-z0-9][a-z0-9._-]*$'
          title_re='^(feat|fix|refactor|test|docs|chore|security|infra)(\([a-z0-9._-]+\))?!?: .+'
          status=0
          if ! [[ "$BRANCH" =~ $branch_re ]]; then
            echo "::error::Branch '$BRANCH' must look like feature/<short-description> (feature|fix|refactor|chore|docs|security)."
            status=1
          fi
          if ! [[ "$TITLE" =~ $title_re ]]; then
            echo "::error::PR title must start with feat:, fix:, refactor:, test:, docs:, chore:, security: or infra:  (got: $TITLE)"
            status=1
          fi
          exit $status

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - run: pip install -r requirements/dev.txt -c requirements/constraints.txt
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - run: pip install -r requirements/dev.txt -c requirements/constraints.txt
      - run: mypy

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - run: pip install -r requirements/dev.txt -c requirements/constraints.txt
      # Lab tests are excluded by default (-m 'not lab'). CI never touches the lab or production.
      # TODO: add an integration job with PostgreSQL, Redis and MongoDB service containers when
      # the first tests marked `integration` exist.
      - run: pytest --cov=services --cov-report=term-missing

  contract:
    name: Contract (OpenAPI, drift, Schemathesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - run: pip install -r requirements/dev.txt -c requirements/constraints.txt
      - name: Validate openapi.yaml, conventions and drift
        run: pytest tests/contract
      - name: Schemathesis against implemented operations
        env:
          BIN: ""
          RATEL_TEST_API_KEY: test-only-not-a-real-key
        run: scripts/ci/run_schemathesis.sh

  config-validate:
    name: Config, workflows, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - run: pip install -r requirements/dev.txt -c requirements/constraints.txt
      - name: Parse YAML, TOML and JSON
        run: python scripts/ci/validate_configs.py
      - name: Check Markdown links
        run: python scripts/ci/check_doc_links.py
      - name: Validate compose file (placeholder values only)
        run: docker compose --env-file .env.example -f compose.dev.yaml config -q
      - name: Shellcheck
        run: shellcheck scripts/ci/*.sh scripts/github/*.sh
      - name: Lint workflows
        run: |
          pip install actionlint-py==1.7.7.23
          actionlint

  web:
    name: Frontend (runs once web/ has a package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f web/desk/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/desk/package-lock.json
      - name: Install, lint, typecheck, test, build
        if: steps.detect.outputs.present == 'true'
        working-directory: web/desk
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present
      - name: Nothing to do yet
        if: steps.detect.outputs.present != 'true'
        run: echo "web/desk has no package.json yet. Skipping."

  # One stable name for branch rules to require. Skipped jobs count as passing.
  ci-success:
    name: ci-success
    if: always()
    needs: [pr-hygiene, lint, typecheck, test, contract, config-validate, web]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::At least one CI job did not pass."
            exit 1
          fi
